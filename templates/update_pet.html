<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Pet - PetCare</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='update_pet.css') }}">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="brand">
            🐾 PetCare
        </div>

        <div class="nav-right">

            <span class="user-info">
                {{ username }} | {{ role }}
            </span>

            <a href="{{ url_for('dashboard') }}"
               class="nav-btn">
                Dashboard
            </a>

            <a href="{{ url_for('pets') }}"
               class="nav-btn">
                Pet Records
            </a>

            <a href="{{ url_for('logout') }}"
               class="logout-btn">
                Logout
            </a>

        </div>

    </nav>


    <!-- MAIN CONTENT -->

    <main class="container">

        <div class="form-card">

            <div class="form-header">

                <div class="pet-icon">
                    ✏️
                </div>

                <h1>Update Pet</h1>

                <p>
                    Edit the pet information below.
                </p>

            </div>


            <!-- FLASH MESSAGES -->

            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    <div class="messages">

                        {% for message in messages %}

                            <div class="flash-message">
                                {{ message }}
                            </div>

                        {% endfor %}

                    </div>

                {% endif %}

            {% endwith %}


            <!-- UPDATE FORM -->

            <form method="POST">

                <!-- PET NAME -->

                <div class="input-group">

                    <label for="name">
                        Pet Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ pet.get_name() }}"
                        placeholder="Enter pet name"
                        required
                    >

                </div>


                <!-- SPECIES -->

                <div class="input-group">

                    <label for="species">
                        Species
                    </label>

                    <select
                        id="species"
                        name="species"
                        required
                    >

                        <option value="Dog"
                            {% if pet.get_species() == "Dog" %}
                                selected
                            {% endif %}>
                            🐶 Dog
                        </option>

                        <option value="Cat"
                            {% if pet.get_species() == "Cat" %}
                                selected
                            {% endif %}>
                            🐱 Cat
                        </option>

                        <option value="Bird"
                            {% if pet.get_species() == "Bird" %}
                                selected
                            {% endif %}>
                            🐦 Bird
                        </option>

                        <option value="Rabbit"
                            {% if pet.get_species() == "Rabbit" %}
                                selected
                            {% endif %}>
                            🐰 Rabbit
                        </option>

                        <option value="Other"
                            {% if pet.get_species() == "Other" %}
                                selected
                            {% endif %}>
                            Other
                        </option>

                    </select>

                </div>


                <!-- AGE -->

                <div class="input-group">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        value="{{ pet.get_age() }}"
                        min="0"
                        max="100"
                        required
                    >

                </div>


                <!-- OWNER -->

                <div class="input-group">

                    <label for="owner">
                        Owner Name
                    </label>

                    <input
                        type="text"
                        id="owner"
                        name="owner"
                        value="{{ pet.get_owner() }}"
                        placeholder="Enter owner's name"
                        required
                    >

                </div>


                <!-- BUTTONS -->

                <div class="form-actions">

                    <a
                        href="{{ url_for('pets') }}"
                        class="cancel-btn">
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="save-btn">
                        💾 Save Changes
                    </button>

                </div>

            </form>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>
        🐾 PetCare Management System
    </footer>

</body>

</html>
